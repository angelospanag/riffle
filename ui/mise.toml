[tools]
bun = "1.4.0"

[tasks.install]
description = "Install dependencies"
run = "bun install"

[tasks.dev]
description = "Start the Next.js dev server (http://localhost:3000)"
run = "bun run dev"

[tasks.build]
description = "Production build"
run = "bun run build"

[tasks.start]
description = "Serve the production build"
run = "bun run start"

[tasks.typecheck]
description = "TypeScript type check"
run = "bun run typecheck"

[tasks.fmt]
description = "Format code with Biome"
run = "bun run format"

[tasks.lint]
description = "Biome check"
run = "bun run lint"

[tasks.generate]
description = "Generate TypeScript client from ../api/openapi.yaml"
run = "bun run generate"

[tasks.vuln]
description = "Scan dependencies for known vulnerabilities"
run = "bun audit"

[tasks.deps]
description = "Update dependencies within package.json version ranges"
run = "bun update"
